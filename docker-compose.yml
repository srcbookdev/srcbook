version: '3'
services:
  srcbook:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${HOST_BIND:-127.0.0.1}:2150:2150'
    volumes:
      - type: bind
        source: ~/.srcbook
        target: /root/.srcbook
        bind:
          create_host_path: true
    environment:
      - NODE_ENV=production
      # Bind every interface *inside* the container — Docker forwards published ports
      # to the container's IP, so binding loopback here would make the port mapping
      # unreachable. Exposure is controlled by HOST_BIND on the ports line above,
      # which defaults to loopback on the host.
      - HOST=0.0.0.0
      - SRCBOOK_INSTALL_DEPS=true
    command: ['pnpm', 'start']
